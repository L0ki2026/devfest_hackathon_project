<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baskt</title>
<style>
:root{--bg:#f1f5ef;--card:#fff;--fg:#17211b;--mut:#5d6b62;--leaf:#2f6b4f;--leaf2:#dcebe2;--flag:#b3134f;--flag2:#fbe3ec;--sun:#b7790a;--sun2:#fbefd2;--bd:#cfd9d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#18211b;--fg:#e6efe8;--mut:#9aaba0;--leaf:#6fc59a;--leaf2:#1d3328;--flag:#ff7fa8;--flag2:#3a1626;--sun:#f0b84a;--sun2:#34280d;--bd:#2d3b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#18211b;--fg:#e6efe8;--mut:#9aaba0;--leaf:#6fc59a;--leaf2:#1d3328;--flag:#ff7fa8;--flag2:#3a1626;--sun:#f0b84a;--sun2:#34280d;--bd:#2d3b31;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.02em}h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.label{border:2px solid var(--fg);border-radius:4px;padding:10px 12px;background:var(--card);margin:0 0 12px}
.label .big{display:flex;justify-content:space-between;align-items:baseline;border-bottom:8px solid var(--fg);padding-bottom:6px;margin-bottom:6px}
.label .big b{font-size:34px;line-height:1}
.row{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border-bottom:0}
.bar{height:8px;background:var(--leaf2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
.bar.low i{background:var(--sun)}.num{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}.item small{color:var(--mut);display:block}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin:3px 4px 0 0;background:var(--leaf2);color:var(--leaf);font-weight:600}
.tag.flag{background:var(--flag2);color:var(--flag)}.tag.warn{background:var(--sun2);color:var(--sun)}
button,select,input[type=text],input[type=number],textarea{font:inherit;color:var(--fg)}
button{border:1px solid var(--leaf);background:var(--leaf);color:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--leaf)}button.sm{padding:5px 10px;font-size:14px}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
select,textarea,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.flex{display:flex;gap:8px;align-items:center}.flex>select{flex:1}
.note{background:var(--flag2);border-left:4px solid var(--flag);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:14px}
.note.good{background:var(--leaf2);border-color:var(--leaf)}.note.warn{background:var(--sun2);border-color:var(--sun)}
.pre{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;border-radius:0;color:var(--mut);padding:12px 4px;font-size:14px}
nav button[aria-current=page]{color:var(--leaf);box-shadow:inset 0 3px 0 var(--leaf)}
.empty{color:var(--mut);padding:10px 0}.fine{color:var(--mut);font-size:12px;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><div id="nav"></div></nav>
<script>
const T={kcal:2000,p:60,c:250,f:65,fib:28,fe:18,vc:90,ca:1000};
const U={kcal:'kcal',p:'g',c:'g',f:'g',fib:'g',fe:'mg',vc:'mg',ca:'mg'};
const N={kcal:'Calories',p:'Protein',c:'Carbs',f:'Fat',fib:'Fiber',fe:'Iron',vc:'Vitamin C',ca:'Calcium'};
// id,name,serving,kcal,p,c,f,fib,fe,vc,ca,ingredients,tag
const R=[
['spinach','Spinach','1 cup cooked',41,5,7,.5,4,6.4,17,245,'',''],
['lentils','Lentils','1 cup cooked',230,18,40,.8,16,6.6,3,38,'',''],
['orange','Orange','1 medium',62,1.2,15,.2,3,.1,70,52,'',''],
['pepper','Red bell pepper','1 medium',37,1.2,7,.4,2.5,.5,152,10,'',''],
['yogurt','Plain Greek yogurt','3/4 cup',100,17,6,.7,0,0,0,180,'',''],
['almonds','Almonds','1 oz',164,6,6,14,3.5,1.1,0,76,'',''],
['banana','Banana','1 medium',105,1.3,27,.4,3.1,.3,10,6,'',''],
['oats','Rolled oats','1/2 cup dry',150,5,27,3,4,2,0,20,'',''],
['eggs','Eggs','2 large',143,12.6,.7,9.5,0,1.8,0,56,'',''],
['coffee','Coffee','1 cup',2,.3,0,0,0,.1,0,5,'','tannin'],
['tea','Green tea','1 cup',2,0,0,0,0,0,0,0,'','tannin'],
['cocoa','Dark chocolate','1 oz',170,2,13,12,3,3.4,0,20,'','tannin'],
['fruitsnack','Fruit snacks (packaged)','1 pouch',80,0,19,0,0,0,0,0,'Corn syrup, sugar, modified corn starch, gelatin, Red 40, Yellow 5, Blue 1, natural and artificial flavors',''],
['puffs','Cheese puffs (packaged)','1 oz',160,2,15,10,1,.3,0,20,'Enriched cornmeal, vegetable oil, whey, Yellow 6, artificial flavor, BHT',''],
['bar','Granola bar (packaged)','1 bar',140,3,24,4,1,1,0,20,'Oats, high fructose corn syrup, palm oil, soy lecithin, BHT','']
].map(a=>({id:a[0],name:a[1],srv:a[2],kcal:a[3],p:a[4],c:a[5],f:a[6],fib:a[7],fe:a[8],vc:a[9],ca:a[10],ing:a[11],tag:a[12]}));
const F=Object.fromEntries(R.map(x=>[x.id,x]));
const BAD=[['red 40','Red 40'],['yellow 5','Yellow 5'],['yellow 6','Yellow 6'],['blue 1','Blue 1'],['high fructose corn syrup','High fructose corn syrup'],['bht','BHT'],['artificial flavor','Artificial flavor'],['sodium nitrite','Sodium nitrite']];
const ALT={fruitsnack:'Dried mango with no added sugar, or fresh orange slices',puffs:'Air-popped popcorn with olive oil',bar:'An oat bar sweetened only with dates, or almonds and a banana'};
const S={tab:'log',log:[{id:'oats',q:1},{id:'coffee',q:1},{id:'banana',q:1}],pantry:['spinach','lentils','orange','banana','oats','eggs','yogurt','coffee'],addSel:'',addQ:1,pantryQ:'',pantrySr:null,det:null,wres:null,wtext:'',wkType:'running',wkMin:45,wkIntensity:'moderate',wkMuscle:'cardio',wkMeal:null,msgWk:''};
try{const raw=localStorage.getItem('baskt')||localStorage.getItem('eatclean');const sv=JSON.parse(raw||'null');if(sv){sv.foods&&sv.foods.forEach(f=>{F[f.id]=f;R.push(f)});S.log=sv.log;S.pantry=sv.pantry}}catch(e){}
async function api(u,body){const r=await fetch(u,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function reg(f){if(!F[f.id]){F[f.id]=f;R.push(f)}}
function srch(){if(!S.sr)return'';if(S.sr==='loading')return'<div class="empty">Searching…</div>';if(!S.sr.length)return'<div class="empty">No matches. Try a simpler name.</div>';return S.sr.map((f,i)=>`<div class="item"><div>${esc(f.name)}<small>${esc(f.src)} · ${f.kcal} kcal, ${f.p}g protein per 100 g</small></div><button class="ghost sm" data-act="addr" data-i="${i}">Add</button></div>`).join('')}
function pantrySrch(){if(!S.pantrySr)return'';if(S.pantrySr==='loading')return'<div class="empty">Searching…</div>';if(!S.pantrySr.length)return'<div class="empty">No matches. Try a simpler name.</div>';return S.pantrySr.map((f,i)=>{const inP=S.pantry.includes(f.id);return`<div class="item"><div>${esc(f.name)}<small>${esc(f.src)} · ${f.kcal} kcal, ${f.p}g protein per 100 g</small></div>${inP?'<span class="tag">In pantry</span>':`<button class="ghost sm" data-act="paddr" data-i="${i}">Add to pantry</button>`}</div>`}).join('')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flags=f=>BAD.filter(b=>f.ing.toLowerCase().includes(b[0])).map(b=>b[1]);
const tot=()=>{const t={};for(const k in T)t[k]=0;S.log.forEach(e=>{for(const k in T)t[k]+=F[e.id][k]*e.q});return t};
const r1=n=>Math.round(n*10)/10;
const opts=(sel)=>R.map(f=>`<option value="${f.id}" ${f.id===(sel||'')?'selected':''}>${esc(f.name)} (${esc(f.srv)})</option>`).join('');
const addOpts=(sel)=>`<option value="" ${!sel?'selected':''}>None</option>${opts(sel)}`;
function parseQ(v){const n=+v;return Number.isFinite(n)?Math.max(0.25,Math.min(99,r1(n))):1}
function scaledNutrients(f,q){const s={};for(const k in T)s[k]=(f[k]||0)*q;return s}
function addPreviewBlock(){
 const id=S.addSel,f=id?F[id]:null,q=parseQ(S.addQ);
 if(!f)return'';
 const sc=scaledNutrients(f,q);
 return `<div class="note good" style="margin-top:10px"><b>Preview · ${r1(q)} serving${q===1?'':'s'} of ${esc(f.name)}</b><br>
  ${Math.round(sc.kcal)} kcal · ${r1(sc.p)}g protein · ${r1(sc.c)}g carbs · ${r1(sc.f)}g fat · ${r1(sc.fib)}g fiber<br>
  <span class="fine">Iron ${r1(sc.fe)} mg · Vit C ${r1(sc.vc)} mg · Calcium ${r1(sc.ca)} mg (scaled from ${esc(f.srv)})</span></div>`;
}
function logQty(n){return `<button type="button" class="ghost sm" data-act="qdn" data-i="${n}" aria-label="Decrease servings">−</button><input data-log-q="${n}" type="number" min="0.25" step="0.25" value="${r1(S.log[n].q)}" aria-label="Servings" style="width:4.2rem;padding:5px 6px;margin:0 4px"><button type="button" class="ghost sm" data-act="qup" data-i="${n}" aria-label="Increase servings">+</button>`}
function gaps(){const t=tot();return['p','fib','fe','vc','ca'].filter(k=>t[k]/T[k]<.6)}
function suggest(k){return R.filter(f=>!flags(f).length&&f[k]>0).map(f=>({f,s:f[k]/Math.max(f.kcal,40)+(S.pantry.includes(f.id)?1:0)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.f)}
function microLine(f,q){
 return `${r1(f.fe*q)}${U.fe} iron · ${r1(f.vc*q)}${U.vc} vit C · ${r1(f.ca*q)}${U.ca} calcium · ${r1(f.f*q)}${U.f} fat`;
}
function partnerScore(anchor,partner){
 let s=partner.vc+partner.fe*0.5+partner.f*2+partner.p;
 if(S.pantry.includes(partner.id))s+=25;
 if(flags(partner).length)s-=50;
 return s;
}
function pickPartner(anchorId,pred){
 const candidates=R.filter(f=>f.id!==anchorId&&pred(f)&&!flags(f).length);
 candidates.sort((a,b)=>partnerScore(F[anchorId],b)-partnerScore(F[anchorId],a));
 return candidates[0]||null;
}
function absorptionPairings(){
 if(!S.log.length)return[];
 const entries=S.log.map(e=>({f:F[e.id],q:e.q,m:{fe:F[e.id].fe*e.q,vc:F[e.id].vc*e.q,ca:F[e.id].ca*e.q,f:F[e.id].f*e.q,fib:F[e.id].fib*e.q,p:F[e.id].p*e.q}}));
 const out=[],seen=new Set();
 const logFe=entries.reduce((s,e)=>s+e.m.fe,0),logVc=entries.reduce((s,e)=>s+e.m.vc,0),logCa=entries.reduce((s,e)=>s+e.m.ca,0);
 for(const e of entries){
  const {f,q,m}=e;
  const mark=k=>{seen.add(k)};
  const has=k=>seen.has(k);
  if(m.fe>=1.5){
   const vcMate=entries.find(o=>o.f.id!==f.id&&o.m.vc>=8);
   if(vcMate){
    if(!has('fe-vc-'+f.id+'-'+vcMate.f.id)){
     mark('fe-vc-'+f.id+'-'+vcMate.f.id);
     out.push({tone:'good',title:`${f.name} + ${vcMate.f.name}`,micro:microLine(f,q),
      text:`This meal has ~${r1(m.fe)} mg iron with ~${r1(vcMate.m.vc)} mg vitamin C—together they support non-heme iron absorption.`});
    }
   }else{
    const p=pickPartner(f.id,x=>x.vc>=15);
    if(p&&!has('fe-vc-need-'+f.id)){
     mark('fe-vc-need-'+f.id);
     out.push({tone:'warn',title:`Boost iron from ${f.name}`,micro:microLine(f,q),
      text:`Add ${p.name} (${p.srv}, ~${r1(p.vc)} mg vit C) in the same meal for higher iron uptake.${S.pantry.includes(p.id)?' In your pantry.':''}`});
    }
   }
   if(m.f<2){
    const fat=pickPartner(f.id,x=>x.f>=5);
    if(fat&&!has('fe-fat-'+f.id)){
     mark('fe-fat-'+f.id);
     out.push({tone:'good',title:`${f.name} with ${fat.name}`,micro:microLine(f,q),
      text:`~${r1(fat.f)} g fat per serving from ${fat.name} helps absorb minerals and carotenoids from iron-rich plants like ${f.name}.`});
    }
   }
  }
  if(m.vc>=15&&logFe<1.5){
   const fe=pickPartner(f.id,x=>x.fe>=1.5);
   if(fe&&!has('vc-fe-'+f.id)){
    mark('vc-fe-'+f.id);
    out.push({tone:'good',title:`${f.name} unlocks ${fe.name}`,micro:microLine(f,q),
     text:`Vitamin C from ${f.name} can raise absorption of iron from ${fe.name} (~${r1(fe.fe)} mg per serving) when eaten together.`});
   }
  }
  if(m.ca>=120&&m.fe>=1.5&&!has('ca-fe-'+f.id)){
   mark('ca-fe-'+f.id);
   out.push({tone:'warn',title:`Calcium and iron in ${f.name}`,micro:microLine(f,q),
    text:`This serving is high in both calcium and iron; they compete—split across meals when both matter.`});
  }
  if(f.tag==='tannin'&&logFe>=1.5&&!has('tannin-fe')){
   mark('tannin-fe');
   const feName=entries.find(x=>x.m.fe>=1.5)?.f.name||'iron-rich foods';
   out.push({tone:'warn',title:`Separate ${f.name} from iron`,micro:microLine(f,q),
    text:`Tannins in ${f.name} reduce iron uptake from ${feName}. Try ~1 hour between them.`});
  }
 }
 if(logFe>=1.5&&logCa>=200&&!entries.some(e=>e.m.fe>=1.5&&e.m.ca>=120)&&!has('meal-ca-fe')){
  mark('meal-ca-fe');
  out.push({tone:'warn',title:'Meal timing: calcium vs iron',micro:`Today's log ~${r1(logFe)} mg iron, ~${r1(logCa)} mg calcium`,
   text:'Large calcium and iron in one day absorb best when spread across meals, not one sitting.'});
 }
 if(!out.length&&logFe>=1.5&&logVc<8){
  const anchor=entries.slice().sort((a,b)=>b.m.fe-a.m.fe)[0];
  const p=pickPartner(anchor.f.id,x=>x.vc>=15);
  if(p){
   out.push({tone:'warn',title:`Maximize iron from ${anchor.f.name}`,micro:microLine(anchor.f,anchor.q),
    text:`Add ${p.name} for vitamin C in the same meal—logged iron is ~${r1(logFe)} mg but vitamin C is only ~${r1(logVc)} mg total.`});
  }
 }
 return out;
}
function pairingSection(){
 const tips=absorptionPairings();
 if(!S.log.length){
  return `<div class="card"><h2>Absorption pairings</h2><p class="sub">Uses iron, vitamin C, calcium, fat, and fiber per logged serving.</p><div class="empty">Log foods on the Log tab to see micronutrient pairings for better absorption.</div></div>`;
 }
 const body=tips.length?tips.map(t=>`<div class="note ${t.tone==='good'?'good':'warn'}"><b>${esc(t.title)}</b><small class="sub" style="display:block;margin:4px 0">${esc(t.micro)}</small>${esc(t.text)}</div>`).join('')
  :'<div class="note good">No strong absorption conflicts in today’s log. Keep pairing iron with vitamin C and spacing tannins from iron-rich meals.</div>';
 return `<div class="card"><h2>Absorption pairings</h2>
  <p class="sub">Suggestions use each food’s micronutrients (per logged quantity) to improve uptake and limit blockers.</p>
  ${body}</div>`;
}
const WK_LABELS={running:'Running',cycling:'Cycling',strength:'Strength / weights',hiit:'HIIT',swimming:'Swimming',yoga:'Yoga / mobility'};
const MUSCLE_LABELS={cardio:'Cardio (not muscle-specific)',legs:'Legs',chest:'Chest',back:'Back',arms:'Arms',shoulders:'Shoulders',core:'Core',full_body:'Full body'};
function pantryName(id){return F[id]?F[id].name+(S.pantry.includes(id)?' (in pantry)':''):null}
function pickPantry(ids){
 return ids.map(id=>pantryName(id)||(F[id]&&F[id].name)||String(id));
}
function postWorkoutPlanLocal(type,min,intensity,muscle){
 const long=min>=60, hi=intensity==='high';
 let foods=[],focus=[],notes=[];
 if(type==='strength'){
  focus=['protein','carbs'];
  const m={
    legs:['eggs','yogurt','lentils','banana'],
    chest:['eggs','yogurt','oats'],
    back:['eggs','lentils','yogurt'],
    arms:['yogurt','eggs','almonds'],
    shoulders:['eggs','yogurt','oats'],
    core:['yogurt','banana','spinach'],
    full_body:['eggs','yogurt','oats','banana'],
    cardio:['eggs','yogurt','oats']
  };
  foods=m[muscle]||m.full_body;
  notes.push('Prioritize protein and carbs to support muscle repair after resistance training.');
 }else if(type==='hiit'){
  focus=['carbs','protein','fluids'];
  foods=hi?['banana','yogurt','oats','orange']:['banana','yogurt','orange'];
  notes.push('HIIT depletes glycogen quickly—combine carbs with moderate protein.');
 }else if(type==='running'||type==='cycling'||type==='swimming'){
  focus=long?['carbs','protein','fluids']:['carbs','protein'];
  foods=long?['banana','oats','yogurt','orange']:['banana','yogurt','almonds'];
  notes.push('Endurance sessions benefit from carbs to replace glycogen plus protein for recovery.');
 }else{
  focus=['balanced snack','fluids'];
  foods=['yogurt','banana','orange'];
  notes.push('Light movement needs a smaller, easy-to-digest snack.');
 }
 if(hi)notes.push('Higher intensity: eat within about 60 minutes post-workout.');
 const portions=foods.slice(0,4).map(id=>{
  const f=F[id];
  if(!f)return id;
  let q=1;
  if(type==='strength'&&f.p>=10)q=1;
  else if(long)q=1.5;
  return `${f.name} (${f.srv}${q>1?' × '+r1(q):''})`;
 });
 return{
  title:'Suggested post-workout plate',
  meal_items:portions,
  pantry_items:pickPantry(foods),
  macro_focus:focus,
  notes,
  summary:`${WK_LABELS[type]||type} · ${min} min · ${intensity} intensity · ${MUSCLE_LABELS[muscle]||muscle}`,
  disclaimer:'General wellness suggestion only—not individualized sports nutrition or medical advice.'
 };
}
function workoutSection(){
 return `<div class="card"><h2>Post-workout meal plan</h2>
  <p class="sub">Pick workout details—we'll suggest a post-workout meal from intensity and target muscles.</p>
  <label class="sub" for="wkMin">Duration (minutes)</label>
  <input id="wkMin" type="number" min="5" max="300" step="5" value="${S.wkMin}" aria-label="Workout duration in minutes">
  <label class="sub" for="wkType" style="margin-top:8px;display:block">Workout type</label>
  <select id="wkType" aria-label="Workout type">${Object.entries(WK_LABELS).map(([k,v])=>`<option value="${k}" ${S.wkType===k?'selected':''}>${esc(v)}</option>`).join('')}</select>
  <label class="sub" for="wkIntensity" style="margin-top:8px;display:block">Intensity</label>
  <select id="wkIntensity" aria-label="Workout intensity"><option value="low" ${S.wkIntensity==='low'?'selected':''}>Low</option><option value="moderate" ${S.wkIntensity==='moderate'?'selected':''}>Moderate</option><option value="high" ${S.wkIntensity==='high'?'selected':''}>High</option></select>
  <label class="sub" for="wkMuscle" style="margin-top:8px;display:block">Target muscle group</label>
  <select id="wkMuscle" aria-label="Target muscle group">${Object.entries(MUSCLE_LABELS).map(([k,v])=>`<option value="${k}" ${S.wkMuscle===k?'selected':''}>${esc(v)}</option>`).join('')}</select>
  <div style="margin-top:10px"><button data-act="wkmeal">Suggest post-workout meal</button></div>
  ${S.msgWk?`<p class="sub">${esc(S.msgWk)}</p>`:''}
  ${S.wkMeal?`<div class="note good"><b>${esc(S.wkMeal.title)}</b><br><small>${esc(S.wkMeal.summary)}</small>
  <p><b>Focus:</b> ${esc((S.wkMeal.macro_focus||[]).join(', '))}</p>
  <p><b>Suggested foods:</b> ${esc((S.wkMeal.meal_items||[]).join('; '))}</p>
  ${(S.wkMeal.pantry_items||[]).length?`<p><b>From your pantry:</b> ${esc(S.wkMeal.pantry_items.join(', '))}</p>`:''}
  ${(S.wkMeal.notes||[]).map(n=>`<p class="sub">${esc(n)}</p>`).join('')}
  <p class="fine">${esc(S.wkMeal.disclaimer||'')}</p></div>`:''}</div>`;
}
function view(){
 const t=tot();
 if(S.tab==='log'){
  const rows=['kcal','p','c','f'].map(k=>`<div class="row"><span>${N[k]}</span><div class="bar"><i style="width:${Math.min(100,t[k]/T[k]*100)}%"></i></div><span class="num">${r1(t[k])}${U[k]}</span></div>`).join('');
  return `<h1>Baskt</h1><p class="sub">Quality and nutrients, tracked together.</p>
  <div class="label"><div class="big"><span>Calories</span><b>${Math.round(t.kcal)}</b></div>${rows}</div>
  <div class="card"><h2>Add food</h2><div class="flex"><input id="q" type="text" value="${esc(S.q||'')}" placeholder="Search USDA and Open Food Facts" aria-label="Search foods"><button data-act="srch">Search</button></div>${srch()}
  <p class="sub" style="margin:12px 0 6px">Set servings first. Search to add, or pick a food below when not None.</p>
  <label class="sub" for="logAmt">Servings (for search &amp; quick add)</label>
  <div class="flex" style="margin-top:4px;flex-wrap:wrap"><input id="logAmt" type="number" min="0.25" step="0.25" value="${r1(S.addQ||1)}" aria-label="Number of servings" style="width:5rem;flex:0 0 auto"><select id="add" aria-label="Food to add" style="flex:1;min-width:140px">${addOpts(S.addSel)}</select><button data-act="add" ${S.addSel?'':'disabled'} style="${S.addSel?'':'opacity:.5;cursor:not-allowed'}">Add</button></div>
  ${addPreviewBlock()}</div>
  ${S.msg?`<div class="note warn">${esc(S.msg)}</div>`:''}
  <div class="card"><h2>Logged</h2>${S.log.length?S.log.map((e,i)=>{const f=F[e.id],fl=flags(f),sc=scaledNutrients(f,e.q);return`<div class="item"><div>${esc(f.name)}<small>${esc(f.srv)} — ${Math.round(sc.kcal)} kcal · ${r1(sc.p)}g P · ${r1(sc.c)}g C · ${r1(sc.f)}g F</small>${fl.map(x=>`<span class="tag flag">${esc(x)}</span>`).join('')}</div><div class="flex" style="flex-wrap:nowrap">${logQty(i)}<button class="ghost sm" data-act="rm" data-i="${i}" aria-label="Remove ${esc(f.name)}">Remove</button></div></div>`}).join(''):'<div class="empty">Nothing logged yet. Add a food above.</div>'}</div>`}
 if(S.tab==='quality'){
  const bad=S.log.filter(e=>flags(F[e.id]).length);
  return `<h1>Food Quality</h1><p class="sub">Review ingredient quality, identify additives, and find practical alternatives.</p>
  <div class="card"><h2>Ingredient quality in today’s log</h2>${bad.length?bad.map(e=>{const f=F[e.id];return`<div class="item"><div><b>${esc(f.name)}</b><small>${esc(f.ing)}</small>${flags(f).map(x=>`<span class="tag flag">${esc(x)}</span>`).join('')}<div class="note good"><b>Cleaner swap:</b> ${esc(ALT[f.id]||'Look for a version without these additives.')}</div></div></div>`}).join(''):'<div class="note good">No flagged additives found in today’s log.</div>'}</div>
<div class="card">
  <h2>Look up packaged food by barcode</h2>
  <p class="sub">Enter the barcode printed on the package.</p>
  <div class="flex">
    <input id="barcode" type="text" inputmode="numeric"
      autocomplete="off" maxlength="14"
      placeholder="Enter UPC or EAN barcode"
      aria-label="Product barcode">
    <button data-act="barcode">Look up</button>
  </div>
  <div id="barcodeout"></div>
</div>`}
 if(S.tab==='gaps'){
  const g=gaps(),all=['p','fib','fe','vc','ca'].map(k=>`<div class="row"><span>${N[k]}</span><div class="bar ${t[k]/T[k]<.6?'low':''}"><i style="width:${Math.min(100,t[k]/T[k]*100)}%"></i></div><span class="num">${Math.round(t[k]/T[k]*100)}%</span></div>`).join('');
  return `<h1>Gaps</h1><p class="sub">Nutrient gaps, absorption pairings from food micros, post-workout fuel, and pantry-first ideas.</p>
  <div class="label"><div class="big"><span>Today's Log</span></div>${all}</div>
  ${g.map(k=>`<div class="card"><h2>Low on ${N[k].toLowerCase()}</h2>${suggest(k).map(f=>`<div class="item"><div>${esc(f.name)}<small>${esc(f.srv)} · ${r1(f[k])}${U[k]}</small></div>${S.pantry.includes(f.id)?'<span class="tag">In pantry</span>':`<button class="ghost sm" data-act="padd" data-id="${f.id}">Add to pantry</button>`}</div>`).join('')}</div>`).join('')||'<div class="note good">You are above 60% on every tracked nutrient.</div>'}
  ${pairingSection()}
  ${workoutSection()}`}
 if(S.tab==='pantry'){
  return `<h1>Pantry</h1><p class="sub">What you keep at home—no servings or quantities, just items for suggestions.</p>
  <div class="card"><h2>Add to pantry</h2><div class="flex"><input id="pq" type="text" value="${esc(S.pantryQ||'')}" placeholder="Search USDA and Open Food Facts" aria-label="Search foods for pantry"><button data-act="psrch">Search</button></div>${pantrySrch()}<p class="fine">Adds the food only (one pantry entry each). Search uses per 100 g reference data.</p></div>
  <div class="card"><h2>At home</h2>${S.pantry.length?S.pantry.map(id=>{const f=F[id],fl=flags(f);return`<div class="item"><div>${esc(f.name)}${fl.length?fl.map(x=>`<span class="tag flag">${esc(x)}</span>`).join(''):'<span class="tag">Clean</span>'}</div><button class="ghost sm" data-act="prm" data-id="${id}" aria-label="Remove ${esc(f.name)}">Remove</button></div>`}).join(''):'<div class="empty">Your pantry is empty. Search above or use <b>Add to pantry</b> on the Gaps tab.</div>'}</div>
  <div class="card"><h2>Nutrients in your pantry</h2>${(()=>{const p={};Object.keys(T).forEach(k=>p[k]=0);S.pantry.forEach(i=>Object.keys(T).forEach(k=>p[k]+=F[i][k]));return['p','fib','fe','vc','ca'].map(k=>`<div class="row"><span>${N[k]}</span><span></span><span class="num">${r1(p[k])}${U[k]}</span></div>`).join('')})()}<p class="fine">Total across one serving of each item.</p></div>`}
}
function render(){
 try{localStorage.setItem('baskt',JSON.stringify({log:S.log,pantry:S.pantry,foods:R.filter(f=>f.src)}))}catch(e){}
 document.getElementById('app').innerHTML=view()+'<p class="fine">Reference targets are generic adult values. Search results come from USDA FoodData Central and Open Food Facts (per 100 g); workout suggestions use Gemini.</p>';
 document.getElementById('nav').innerHTML=[['log','Log'],['quality','Quality'],['gaps','Gaps'],['pantry','Pantry']].map(a=>`<button data-tab="${a[0]}" ${S.tab===a[0]?'aria-current="page"':''}>${a[1]}</button>`).join('');
}
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=id=>document.getElementById(id);
 if(a==='add'){
  const id=v('add').value;
  if(!id){S.msg='Choose a food from the list (not None).';render();return}
  const q=parseQ(v('logAmt')&&v('logAmt').value!=null?v('logAmt').value:S.addQ);
  S.addSel=id;S.addQ=q;S.msg='';
  const x=S.log.find(l=>l.id===id);
  if(x)x.q=r1(x.q+q);else S.log.push({id,q});
 }
 if(a==='qup'){const i=+b.dataset.i;if(S.log[i]){S.log[i].q=parseQ(S.log[i].q+0.25);render();return}}
 if(a==='qdn'){const i=+b.dataset.i;if(S.log[i]){S.log[i].q=parseQ(S.log[i].q-0.25);render();return}}
 if(a==='rm')S.log.splice(+b.dataset.i,1);
  if(a==='barcode'){
    const code=v('barcode').value.trim();
    const out=v('barcodeout');

    if(!/^\d{8,14}$/.test(code)){
      out.innerHTML='<div class="note warn">Enter a valid barcode containing 8 to 14 digits.</div>';
      return;
    }

    out.innerHTML='<div class="empty">Looking up product...</div>';

    api('/api/barcode/'+encodeURIComponent(code))
      .then(p=>{
        const n=p.nutriments||{};

        const fmt=(key,unit,scale=1)=>{
          if(n[key]===undefined||n[key]===null||n[key]==='') return 'Not reported';
          const value=Number(n[key])*scale;
          if(!Number.isFinite(value)) return 'Not reported';
          return `${Math.round(value*10)/10} ${unit}`;
        };

        const items=[
          ['Calories','energy-kcal_100g','kcal'],
          ['Protein','proteins_100g','g'],
          ['Carbs','carbohydrates_100g','g'],
          ['Total fat','fat_100g','g'],
          ['Saturated fat','saturated-fat_100g','g'],
          ['Fiber','fiber_100g','g'],
          ['Total sugars','sugars_100g','g'],
          ['Sodium','sodium_100g','mg',1000]
        ];

        const rows=items.map(([label,key,unit,scale=1])=>
          `<div class="row"><span>${label}</span><span></span><span class="num">${fmt(key,unit,scale)}</span></div>`
        ).join('');

        const ingredients=p.ingredients_text||'Not reported';
        const allergens=p.allergens||p.allergens_en||'Not reported';
        const additives=Array.isArray(p.additives_tags)&&p.additives_tags.length
          ? p.additives_tags.join(', ')
          : 'Not reported';

        out.innerHTML=`
          <div class="item">
            <div>
              <b>${esc(p.product_name||'Product name not reported')}</b>
              <small>${esc(p.brands||'Brand not reported')}</small>
              <small>Serving size: ${esc(p.serving_size||'Not reported')}</small>
            </div>
          </div>
          <div class="label">
            <div class="big">
              <span>Nutrition facts</span>
              <b style="font-size:15px">Per 100 g</b>
            </div>
            ${rows}
          </div>
          <div class="note">
            <b>Ingredients</b>
            <p>${esc(ingredients)}</p>
          </div>
          <div class="note">
            <b>Allergens</b>
            <p>${esc(allergens)}</p>
          </div>
          <div class="note good">
            <b>Product information</b>
            <p>Nutri-Score: ${esc(p.nutriscore_grade||'Not reported')}</p>
            <p>NOVA group: ${esc(p.nova_group??'Not reported')}</p>
            <p>Additives: ${esc(additives)}</p>
          </div>
          <p class="fine">Source: Open Food Facts. Product information may be incomplete or outdated.</p>
        `;
      })
      .catch(error=>{
        out.innerHTML=`<div class="note warn">${esc(error.message||'Could not retrieve this product.')}</div>`;
      });

    return;
  }

 if(a==='padd'){const id=b.dataset.id;if(!S.pantry.includes(id))S.pantry.push(id)}
 if(a==='prm')S.pantry=S.pantry.filter(i=>i!==b.dataset.id);
 if(a==='wkmeal'){
  S.wkMin=Math.max(5,Math.min(300,+v('wkMin').value||45));
  S.wkType=v('wkType').value;
  S.wkIntensity=v('wkIntensity').value;
  S.wkMuscle=v('wkMuscle').value;
  S.wkMeal=null;S.msgWk='Building meal plan…';
  const body={type:S.wkType,durationMinutes:S.wkMin,intensity:S.wkIntensity,muscleGroup:S.wkMuscle,pantry:S.pantry.map(i=>F[i].name)};
  api('/api/workout-meal',body).then(r=>{S.wkMeal=r;S.msgWk=''}).catch(()=>{S.wkMeal=postWorkoutPlanLocal(S.wkType,S.wkMin,S.wkIntensity,S.wkMuscle);S.msgWk='Using on-device rules (Gemini unavailable).'}).then(render);
  return;
 }
 if(a==='srch'){S.q=v('q').value.trim();if(S.q){S.sr='loading';api('/api/search?q='+encodeURIComponent(S.q)).then(r=>{S.sr=r}).catch(()=>{S.sr=[]}).then(render)}}
 if(a==='psrch'){S.pantryQ=v('pq').value.trim();if(S.pantryQ){S.pantrySr='loading';api('/api/search?q='+encodeURIComponent(S.pantryQ)).then(r=>{S.pantrySr=r}).catch(()=>{S.pantrySr=[]}).then(render)}}
 if(a==='paddr'){const f=S.pantrySr[+b.dataset.i];reg(f);if(!S.pantry.includes(f.id))S.pantry.push(f.id);S.pantrySr=null;S.pantryQ='';render();return}
 if(a==='addr'){
  const f=S.sr[+b.dataset.i];reg(f);
  const q=parseQ(v('logAmt')&&v('logAmt').value!=null?v('logAmt').value:S.addQ);
  S.addQ=q;S.msg='';
  const x=S.log.find(l=>l.id===f.id);
  if(x)x.q=r1(x.q+q);else S.log.push({id:f.id,q});
  S.sr=null;S.q='';
 }
 render()});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='add'){S.addSel=t.value||'';S.tab==='log'&&render();return}
 if(t.id==='logAmt'){S.addQ=parseQ(t.value);S.tab==='log'&&render();return}
 if(t.dataset.logQ!=null){
  const i=+t.dataset.logQ;
  if(S.log[i]){S.log[i].q=parseQ(t.value);render()}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='logAmt'){S.addQ=parseQ(e.target.value);S.tab==='log'&&render()}
});
render();
</script>
</body>
</html>
