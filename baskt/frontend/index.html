<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baskt</title>
<style>
:root{--bg:#f1f5ef;--card:#fff;--fg:#17211b;--mut:#5d6b62;--leaf:#2f6b4f;--leaf2:#dcebe2;--flag:#b3134f;--flag2:#fbe3ec;--sun:#b7790a;--sun2:#fbefd2;--bd:#cfd9d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#18211b;--fg:#e6efe8;--mut:#9aaba0;--leaf:#6fc59a;--leaf2:#1d3328;--flag:#ff7fa8;--flag2:#3a1626;--sun:#f0b84a;--sun2:#34280d;--bd:#2d3b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#18211b;--fg:#e6efe8;--mut:#9aaba0;--leaf:#6fc59a;--leaf2:#1d3328;--flag:#ff7fa8;--flag2:#3a1626;--sun:#f0b84a;--sun2:#34280d;--bd:#2d3b31;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.02em}h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.label{border:2px solid var(--fg);border-radius:4px;padding:10px 12px;background:var(--card);margin:0 0 12px}
.label .big{display:flex;justify-content:space-between;align-items:baseline;border-bottom:8px solid var(--fg);padding-bottom:6px;margin-bottom:6px}
.label .big b{font-size:34px;line-height:1}
.row{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border-bottom:0}
.bar{height:8px;background:var(--leaf2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
.bar.low i{background:var(--sun)}.num{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}.item small{color:var(--mut);display:block}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin:3px 4px 0 0;background:var(--leaf2);color:var(--leaf);font-weight:600}
.tag.flag{background:var(--flag2);color:var(--flag)}.tag.warn{background:var(--sun2);color:var(--sun)}
button,select,input[type=text],textarea,input[type=number]{font:inherit;color:var(--fg)}
button{border:1px solid var(--leaf);background:var(--leaf);color:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--leaf)}button.sm{padding:5px 10px;font-size:14px}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
select,textarea,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.flex{display:flex;gap:8px;align-items:center}.flex>select{flex:1}
.note{background:var(--flag2);border-left:4px solid var(--flag);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:14px}
.note.good{background:var(--leaf2);border-color:var(--leaf)}.note.warn{background:var(--sun2);border-color:var(--sun)}
.pre{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;border-radius:0;color:var(--mut);padding:12px 4px;font-size:14px}
nav button[aria-current=page]{color:var(--leaf);box-shadow:inset 0 3px 0 var(--leaf)}
.empty{color:var(--mut);padding:10px 0}.fine{color:var(--mut);font-size:12px;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><div id="nav"></div></nav>
<script>
const S={tab:'pantry',pantry:[],insights:null,recs:null,workout:null,wtext:'',msg:'',det:null,sr:null,q:'',busy:false};
let refreshTimer=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>n==null?'—':Math.round(n*10)/10;
const uid=()=>'it_'+Math.random().toString(36).slice(2,9);
try{
  const sv=JSON.parse(localStorage.getItem('baskt_v2')||'null');
  if(sv&&Array.isArray(sv.pantry)) S.pantry=sv.pantry;
}catch(e){}
async function api(u,body){
  const r=await fetch(u,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const msg=typeof j.error==='string'?j.error:j.detail?.error?.message||(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail||j))||r.status;throw new Error(msg)}
  return j;
}
function itemFromHit(h){
  return {id:h.id||uid(),name:h.name,quantity:100,unit:'g',grams_per_unit:null,estimated:false,ingredients:h.ing||'',source:h.src||'search'};
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(refreshInsights,400);
}
async function refreshInsights(){
  if(!S.pantry.length){S.insights=null;S.recs=null;render();return}
  if(S.busy)return;
  S.busy=true;S.msg='Calculating pantry nutrients…';render();
  try{
    S.insights=await api('/api/pantry-insights',{items:S.pantry});
    const ds=S.insights.analysis?.data_source;
    S.msg=ds==='demo'?'Nutrients from labeled demo dataset (not live USDA).':'';
    if(S.tab==='gaps')await loadRecs();
  }catch(err){S.msg=err.message;S.insights=null}
  S.busy=false;render();
}
async function loadRecs(){
  if(!S.pantry.length)return;
  const focus=(S.insights?.gaps||[]).slice(0,2).map(g=>g.nutrient);
  S.recs=await api('/api/recommend-additions',{items:S.pantry,focus_nutrients:focus});
}
function barRows(which){
  const bars=S.insights?.bars||[];
  const subset=which==='macro'?bars.slice(0,4):bars;
  return subset.map(b=>`<div class="row"><span>${esc(b.label)}</span><div class="bar ${b.pct!=null&&b.pct<35?'low':''}"><i style="width:${Math.min(100,b.pct||0)}%"></i></div><span class="num">${b.value!=null?r1(b.value)+b.unit:'—'}</span></div>`).join('');
}
function srch(){
  if(!S.sr)return'';
  if(S.sr==='loading')return'<div class="empty">Searching…</div>';
  if(!S.sr.length)return'<div class="empty">No matches. Try a simpler name.</div>';
  return S.sr.map((f,i)=>`<div class="item"><div>${esc(f.name)}<small>${esc(f.src)} · ${f.kcal} kcal, ${f.p}g protein / 100g</small></div><button class="ghost sm" data-act="addr" data-i="${i}">Add</button></div>`).join('');
}
function scanBlock(){
  if(!S.det)return'';
  return `<div class="card"><h2>Confirm scan</h2><img class="pre" src="${S.det.url}" alt="Grocery photo">
    <p class="sub">Gemini extraction—confirm names and amounts before they join your pantry.</p>
    ${(S.det.items||[]).map((d,i)=>`<div class="item"><label><input type="checkbox" data-chk="${i}" ${d.on?'checked':''}> ${esc(d.name)}<small>${d.quantity??'?'} ${esc(d.unit||'g')}${d.estimated?' · estimated':''}</small></label></div>`).join('')}
    ${(S.det.warnings||[]).map(w=>`<div class="note warn">${esc(w)}</div>`).join('')}
    <div class="flex" style="margin-top:10px"><button data-act="confirmScan">Add to pantry</button><button class="ghost" data-act="cancelScan">Cancel</button></div></div>`;
}
async function scanFile(f){
  if(!f)return;
  S.msg='Scanning image…';render();
  try{
    const fd=new FormData();fd.append('file',f);
    const r=await fetch('/api/parse-groceries',{method:'POST',body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error?.message||j.error||r.status);
    S.det={url:URL.createObjectURL(f),items:(j.items||[]).map(x=>({...x,on:true})),warnings:j.warnings||[]};
    S.msg='';
  }catch(e){
    try{
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
      const j=await api('/api/identify',{image:b64,mime:f.type||'image/jpeg'});
      S.det={url:URL.createObjectURL(f),items:(j.items||[]).map((x,i)=>({id:'scan_'+(i+1),name:x.name,quantity:100,unit:'g',estimated:true,on:true})),warnings:j.warnings||[]};
      S.msg='';
    }catch(err){S.msg='Scan failed: '+err.message;S.det=null}
  }
  render();
}
function pantryList(){
  return S.pantry.length?S.pantry.map((p,i)=>`<div class="item"><div>${esc(p.name)}<small>${p.quantity??'?'} ${esc(p.unit)}${p.estimated?' · est.':''}${p.source?` · ${esc(p.source)}`:''}</small>${p.ingredients?`<small>${esc(p.ingredients.slice(0,120))}</small>`:''}</div>
    <span><button class="ghost sm" data-act="qtym" data-i="${i}">−</button> <button class="ghost sm" data-act="qtyp" data-i="${i}">+</button> <button class="ghost sm" data-act="rm" data-i="${i}">Remove</button></span></div>`).join('')
  :'<div class="empty">Your pantry is empty. Search or scan groceries to begin.</div>';
}
function view(){
  const ana=S.insights?.analysis;
  if(S.tab==='pantry'){
    const kcal=ana?.totals?.calories_kcal;
    const rows=barRows('macro')||'<div class="empty">Add items to see calculated nutrients.</div>';
    return `<h1>Baskt</h1><p class="sub">Your pantry—one list for inventory and nutrients (not a food log).</p>
    ${S.msg?`<div class="note warn">${esc(S.msg)}</div>`:''}
    <div class="label"><div class="big"><span>Pantry calories</span><b>${kcal!=null?Math.round(kcal):'—'}</b></div>${rows}
    <p class="fine">${esc(ana?.disclaimer||'Nutrients are estimated from USDA/Open Food Facts via the backend.')}</p></div>
    <div class="card"><h2>Add to pantry</h2>
    <div class="flex"><input id="q" type="text" value="${esc(S.q||'')}" placeholder="Search USDA & Open Food Facts"><button data-act="srch">Search</button></div>${srch()}
    <div style="margin-top:10px"><label class="sub" for="ph">Scan groceries (Gemini)</label><input id="ph" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></div></div>
    ${scanBlock()}
    <div class="card"><h2>At home</h2>${pantryList()}</div>`;
  }
  if(S.tab==='quality'){
    const q=S.insights?.quality||[];
    const pair=S.insights?.pairings||[];
    return `<h1>Food Quality</h1><p class="sub">Based on your pantry inventory and ingredient lists.</p>
    <div class="card"><h2>Flagged additives in pantry</h2>${q.length?q.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><small>${esc(x.ingredients)}</small>${x.flags.map(f=>`<span class="tag flag">${esc(f)}</span>`).join('')}</div></div>`).join(''):'<div class="note good">No flagged additives in pantry packaged items.</div>'}</div>
    <div class="card"><h2>Absorption pairings</h2>${pair.length?pair.map(p=>`<div class="note ${p.level}">${esc(p.text)}</div>`).join(''):'<div class="empty">Add iron- and vitamin C–rich foods to your pantry for pairing tips.</div>'}</div>`;
  }
  const gaps=S.insights?.gaps||[];
  const bars=(S.insights?.bars||[]).slice(4).map(b=>`<div class="row"><span>${esc(b.label)}</span><div class="bar low"><i style="width:${Math.min(100,b.pct||0)}%"></i></div><span class="num">${b.pct!=null?b.pct+'%':'—'}</span></div>`).join('');
  const w=S.workout;
  return `<h1>Gaps</h1><p class="sub">Relative nutrient representation in your pantry—not daily intake or deficiency.</p>
  <div class="label"><div class="big"><span>vs. generic reference</span></div>${bars||'<div class="empty">Update pantry to see gaps.</div>'}</div>
  ${gaps.map(g=>`<div class="card"><h2>Lower ${esc(g.label)}</h2><p class="sub">${esc(g.note)} (${g.pct_of_reference??'?'}% of reference in basket)</p></div>`).join('')||'<div class="note good">No low relative nutrients in this pantry snapshot.</div>'}
  <div class="card"><h2>Pantry additions to consider</h2>${(S.recs?.suggestions||[]).slice(0,4).map(s=>`<div class="item"><div><b>${esc(s.name)}</b><small>${esc(s.reason)}</small></div></div>`).join('')||'<div class="empty">Load pantry items first.</div>'}</div>
  <div class="card"><h2>Workout meals (from pantry)</h2>
  <div class="flex"><input id="wk" type="text" value="${esc(S.wtext)}" placeholder="45 minute run, moderate"><button data-act="wk">Suggest</button></div>
  ${w?w.meals.map(m=>`<div class="note good"><b>${esc(m.title)}</b><br>${m.ingredients.map(i=>esc(i.name)).join(', ')}<br><small>${esc(w.workout_summary)} · priorities: ${w.recovery_priorities.join(', ')}</small></div>`).join(''):''}
  <p class="fine">${w?esc(w.disclaimer):''}</p></div>`;
}
function save(){
  try{localStorage.setItem('baskt_v2',JSON.stringify({pantry:S.pantry}))}catch(e){}
}
function render(){
  save();
  document.getElementById('app').innerHTML=view()+'<p class="fine">All macro/micro numbers come from /api/pantry-insights (Python + USDA). Reference bars are generic, not medical targets.</p>';
  document.getElementById('nav').innerHTML=[['pantry','Pantry'],['quality','Quality'],['gaps','Gaps']].map(a=>`<button data-tab="${a[0]}" ${S.tab===a[0]?'aria-current="page"':''}>${a[1]}</button>`).join('');
  const ph=document.getElementById('ph');if(ph)ph.onchange=e=>scanFile(e.target.files[0]);
  document.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{S.det.items[c.dataset.chk].on=c.checked});
}
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab;if(S.tab==='gaps'&&S.pantry.length&&!S.recs)loadRecs().then(()=>render());render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=id=>document.getElementById(id);
  if(a==='srch'){S.q=v('q').value.trim();if(!S.q)return;S.sr='loading';api('/api/search?q='+encodeURIComponent(S.q)).then(r=>{S.sr=r}).catch(()=>{S.sr=[]}).then(render)}
  if(a==='addr'){const f=S.sr[+b.dataset.i];S.pantry.push(itemFromHit(f));S.sr=null;S.q='';scheduleRefresh()}
  if(a==='rm'){S.pantry.splice(+b.dataset.i,1);scheduleRefresh()}
  if(a==='qtyp'){const p=S.pantry[+b.dataset.i];if(p.quantity!=null)p.quantity=Math.round((p.quantity+50)*10)/10;else p.quantity=100;scheduleRefresh()}
  if(a==='qtym'){const p=S.pantry[+b.dataset.i];p.quantity=Math.max(10,Math.round(((p.quantity||100)-50)*10)/10);scheduleRefresh()}
  if(a==='confirmScan'){S.det.items.filter(d=>d.on).forEach(d=>{S.pantry.push({id:d.id||uid(),name:d.name,quantity:d.quantity??null,unit:d.unit||'g',grams_per_unit:d.grams_per_unit||null,estimated:!!d.estimated,ingredients:'',source:'scan'});});S.det=null;scheduleRefresh()}
  if(a==='cancelScan')S.det=null;
  if(a==='wk'){S.wtext=v('wk').value;S.workout=null;api('/api/post-workout-meal',{workout_text:S.wtext,items:S.pantry}).then(r=>{S.workout=r}).catch(err=>{S.msg=err.message}).then(render);return}
  render();
});
if(S.pantry.length)refreshInsights();else render();
</script>
</body>
</html>
